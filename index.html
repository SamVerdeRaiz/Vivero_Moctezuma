function obtenerInfo(nombre){

const texto = nombre
.toLowerCase()
.replace(/\s/g,'');

for(let clave in basePlantas){

const claveNormalizada =
clave.toLowerCase();

if(
texto.includes(claveNormalizada)
||
claveNormalizada.includes(texto)
){
return basePlantas[clave];
}

}

return{

sustrato:"Sin registro",
humedad:"Sin registro",
luz:"Sin registro",
fertilizante:"Sin registro",
riego:"Sin registro",
temperatura:"Sin registro"

};

function seleccionarPlanta(){

const selector =
document.getElementById("selectorPlanta");

const input =
document.getElementById("nombre");

if(!selector.value)return;

input.value=
selector.value
.replace(/([A-Z])/g," $1")
.replace(/^./,c=>c.toUpperCase());

}

}function guardarPlanta(){

const nombre=
document
.getElementById("nombre")
.value
.trim();

const comentario=
document
.getElementById("comentario")
.value
.trim();

const tecnica=
document
.getElementById("tecnica")
.value
.trim();

if(nombre===""){

alert("Ingresa una planta");

return;

}

const info=
obtenerInfo(nombre);

const planta={

nombre,

comentario,

tecnica:

tecnica||"Sin técnica registrada",

fecha:
new Date()
.toLocaleDateString(),

bloqueado:false,

...info

};

plantas.push(planta);

localStorage.setItem(

"plantas",

JSON.stringify(
plantas
)

);

document
.getElementById("nombre")
.value="";

document
.getElementById("comentario")
.value="";

document
.getElementById("tecnica")
.value="";

renderizar();


}

function cargarListaPlantas(){

const selector =
document.getElementById("selectorPlanta");

if(!selector)return;

selector.innerHTML=`
<option value="">
🌿 Buscar planta registrada...
</option>
`;

Object.keys(basePlantas)
.sort()
.forEach(nombre=>{

const opcion =
document.createElement("option");

opcion.value=nombre;

opcion.textContent=
nombre
.replace(/([A-Z])/g," $1")
.replace(/^./,c=>c.toUpperCase());

selector.appendChild(opcion);

});

}

function guardarInventario(){

const nombre =
document
.getElementById("invNombre")
.value
.trim();

const cantidad =
parseInt(
document
.getElementById("invCantidad")
.value
) || 0;

const categoria =
document
.getElementById("invCategoria")
.value
.trim();

if(!nombre){

alert("Escribe producto");

return;

}

const existente =
inventario.findIndex(
item =>
item.nombre.toLowerCase() === nombre.toLowerCase()
);

if(existente >= 0){

inventario[existente] = {

...inventario[existente],

cantidad,

categoria:
categoria || "General",

fecha:
new Date().toLocaleDateString()

};

}else{

inventario.push({

nombre,

cantidad,

categoria:
categoria || "General",

fecha:
new Date().toLocaleDateString()

});

}

localStorage.setItem(
"inventario",
JSON.stringify(inventario)
);

document.getElementById("invNombre").value="";
document.getElementById("invCantidad").value="";
document.getElementById("invCategoria").value="";

renderizarInventario();

}

function editarInventario(index){

const item=inventario[index];

const nombre=prompt(
"Producto",
item.nombre
);

if(nombre===null)return;

const cantidad=prompt(
"Cantidad",
item.cantidad
);

if(cantidad===null)return;

const categoria=prompt(
"Categoría",
item.categoria
);

if(categoria===null)return;

inventario[index]={

...item,

nombre:nombre.trim(),

cantidad:parseInt(cantidad)||0,

categoria:categoria.trim(),

};

localStorage.setItem(
"inventario",
JSON.stringify(inventario)
);

renderizarInventario();

}

!confirm("¿Eliminar producto?")
)return;

inventario.splice(index,1);

"inventario",
JSON.stringify(inventario)
);

renderizarInventario();

}
